<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1500" viewBox="0 0 1160 1500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="1160" height="1500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="42" font-size="21" font-weight="bold" fill="#1F2937">MFFP Round 1 — Top Models: Architecture and Multi-Fidelity Method</text>
  <text x="30" y="64" font-size="12" fill="#6B7280">skill = nRMSE(model) / nRMSE(copy-LF) — lower is better, 1.0 = copying the LF field</text>

  <!-- Legend -->
  <g font-size="12" fill="#1F2937">
    <rect x="30"  y="80" width="14" height="14" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="50"  y="92">low-fidelity (LF) data</text>
    <rect x="215" y="80" width="14" height="14" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="235" y="92">high-fidelity (HF) data / prediction</text>
    <rect x="480" y="80" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="500" y="92">trained neural network</text>
    <rect x="680" y="80" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="700" y="92">closed-form / fitted (no gradient training)</text>
  </g>
  <line x1="30" y1="112" x2="1130" y2="112" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= P0 Baseline ================= -->
  <g>
    <text x="30" y="142" font-size="15" font-weight="bold" fill="#1F2937">0 · Baseline: mf_fno_transfer_film — transfer learning</text>
    <text x="640" y="142" font-size="13" fill="#6B7280">panel geomean skill 6.70 (loses to copy-LF wherever LF exists)</text>

    <rect x="30" y="165" width="215" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="137" y="189" font-size="12.5" fill="#1F2937" text-anchor="middle">many LF solves</text>
    <text x="137" y="206" font-size="12.5" fill="#1F2937" text-anchor="middle">(cheap, coarse grid)</text>

    <line x1="245" y1="194" x2="330" y2="194" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="288" y="185" font-size="11" fill="#6B7280" text-anchor="middle">stage 1: pretrain</text>

    <rect x="333" y="165" width="280" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="473" y="189" font-size="12.5" fill="#1F2937" text-anchor="middle">FNO (spectral conv, 12 modes)</text>
    <text x="473" y="206" font-size="12.5" fill="#1F2937" text-anchor="middle">+ FiLM: cond vector → scale/shift per channel</text>

    <line x1="613" y1="194" x2="698" y2="194" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="656" y="185" font-size="11" fill="#6B7280" text-anchor="middle">stage 2: fine-tune</text>

    <rect x="701" y="165" width="180" height="58" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="791" y="189" font-size="12.5" fill="#1F2937" text-anchor="middle">few HF solves</text>
    <text x="791" y="206" font-size="12.5" fill="#1F2937" text-anchor="middle">(5–400 samples)</text>

    <text x="30" y="252" font-size="11.5" font-style="italic" fill="#6B7280">MF method: fidelity lives only in the weights (LF-pretrain → HF-finetune). Never reads LF at test time — which is why every correction model below beats it where test LF ships.</text>
  </g>
  <line x1="30" y1="272" x2="1130" y2="272" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= P1 s6 ================= -->
  <g>
    <text x="30" y="302" font-size="15" font-weight="bold" fill="#1F2937">1–3 · s6 lineage: defect correction — round leaderboard head</text>
    <text x="640" y="302" font-size="13" fill="#6B7280">trust head 0.188 · circ_repair 0.193 · B1 0.235 (6-dataset panel)</text>

    <rect x="30" y="325" width="160" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="110" y="349" font-size="12.5" fill="#1F2937" text-anchor="middle">test-time LF field</text>
    <text x="110" y="366" font-size="12.5" fill="#1F2937" text-anchor="middle">↑ upsampled to HF grid</text>

    <line x1="190" y1="354" x2="240" y2="354" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="243" y="325" width="205" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="345" y="349" font-size="12.5" fill="#1F2937" text-anchor="middle">fitted LSI filter</text>
    <text x="345" y="366" font-size="12.5" fill="#1F2937" text-anchor="middle">(least-squares conv kernel, 0 params)</text>

    <line x1="448" y1="354" x2="498" y2="354" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="501" y="325" width="205" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="603" y="349" font-size="12.5" fill="#1F2937" text-anchor="middle">local CNN corrector (~85k)</text>
    <text x="603" y="366" font-size="12.5" fill="#1F2937" text-anchor="middle">circular padding on periodic domains</text>

    <line x1="706" y1="354" x2="756" y2="354" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="759" y="325" width="175" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="846" y="349" font-size="12.5" fill="#1F2937" text-anchor="middle">OOF trust gate</text>
    <text x="846" y="366" font-size="12.5" fill="#1F2937" text-anchor="middle">α per sample (can be 0)</text>

    <line x1="934" y1="354" x2="984" y2="354" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="987" y="325" width="143" height="58" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="1058" y="349" font-size="12.5" fill="#1F2937" text-anchor="middle">prediction =</text>
    <text x="1058" y="366" font-size="12.5" fill="#1F2937" text-anchor="middle">LF + α·correction</text>

    <text x="30" y="412" font-size="11.5" font-style="italic" fill="#6B7280">MF method: Richardson-style defect correction — the network only models the fidelity gap HF−LF; the LF field does the bulk of the work.</text>
    <text x="30" y="430" font-size="11.5" font-style="italic" fill="#6B7280">Caveat: on the sharp panel most of the learned "defect" is the benchmark's half-cell registration artifact; the genuine edge is on data whose defect is not shift-invariant.</text>
  </g>
  <line x1="30" y1="450" x2="1130" y2="450" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= P2 s2 ================= -->
  <g>
    <text x="30" y="480" font-size="15" font-weight="bold" fill="#1F2937">4 · s2: lf_resid_fno — global residual operator</text>
    <text x="640" y="480" font-size="13" fill="#6B7280">geomean 0.380 (5-dataset beyond-copy set)</text>

    <rect x="30" y="503" width="230" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="145" y="527" font-size="12.5" fill="#1F2937" text-anchor="middle">upsampled LF as input channel</text>
    <text x="145" y="544" font-size="12.5" fill="#1F2937" text-anchor="middle">+ cond vector</text>

    <line x1="260" y1="532" x2="310" y2="532" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="313" y="503" width="270" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="448" y="527" font-size="12.5" fill="#1F2937" text-anchor="middle">FNO + FiLM (champion backbone)</text>
    <text x="448" y="544" font-size="12.5" fill="#1F2937" text-anchor="middle">zero-initialized output head</text>

    <line x1="583" y1="532" x2="633" y2="532" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="608" y="523" font-size="11" fill="#6B7280" text-anchor="middle">outputs</text>

    <rect x="636" y="503" width="200" height="58" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="736" y="527" font-size="12.5" fill="#1F2937" text-anchor="middle">residual  HF − LF</text>
    <text x="736" y="544" font-size="12.5" fill="#1F2937" text-anchor="middle">(global max|residual| scaler)</text>

    <line x1="836" y1="532" x2="886" y2="532" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="861" y="523" font-size="11" fill="#6B7280" text-anchor="middle">+ LF</text>

    <rect x="889" y="503" width="180" height="58" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="979" y="536" font-size="12.5" fill="#1F2937" text-anchor="middle">HF prediction</text>

    <text x="30" y="590" font-size="11.5" font-style="italic" fill="#6B7280">MF method: residual learning — the global-spectral cousin of s6's local corrector. Mechanism analysis: ~96–100% of the sharp-panel win is the re-learned registration ramp</text>
    <text x="30" y="608" font-size="11.5" font-style="italic" fill="#6B7280">(cosine 0.99 with the analytic half-cell fix); its global scaler is the round's amplitude-pathology root cause (one sample = 89% of the loss on helmholtz).</text>
  </g>
  <line x1="30" y1="628" x2="1130" y2="628" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= P3 s1 ================= -->
  <g>
    <text x="30" y="658" font-size="15" font-weight="bold" fill="#1F2937">5 · s1: fidelity-ladder FNO + closed-form gain head — flagship few-shot dataset (ifc_poisson)</text>
    <text x="815" y="658" font-size="13" fill="#6B7280">self_only 0.609 · gain head 0.694</text>

    <!-- ladder stack -->
    <rect x="30" y="681" width="185" height="20" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
    <rect x="30" y="705" width="185" height="20" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
    <rect x="30" y="729" width="185" height="20" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
    <rect x="30" y="753" width="185" height="20" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.6"/>
    <text x="122" y="695"  font-size="11" fill="#1F2937" text-anchor="middle">8² solves × 100 conditions</text>
    <text x="122" y="719" font-size="11" fill="#1F2937" text-anchor="middle">16² solves × 50</text>
    <text x="122" y="743" font-size="11" fill="#1F2937" text-anchor="middle">32² solves × 20</text>
    <text x="122" y="767" font-size="11" fill="#1F2937" text-anchor="middle">64² (HF) × 5</text>

    <line x1="215" y1="722" x2="268" y2="722" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="271" y="693" width="265" height="58" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="403" y="717" font-size="12.5" fill="#1F2937" text-anchor="middle">FNO — joint training across levels</text>
    <text x="403" y="734" font-size="12.5" fill="#1F2937" text-anchor="middle">per-level target norm · self-level pairs only</text>

    <line x1="536" y1="722" x2="586" y2="722" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="561" y="713" font-size="11" fill="#6B7280" text-anchor="middle">fine-tune</text>

    <rect x="589" y="693" width="150" height="58" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="664" y="717" font-size="12.5" fill="#1F2937" text-anchor="middle">5 HF samples</text>
    <text x="664" y="734" font-size="12.5" fill="#1F2937" text-anchor="middle">(the whole HF budget)</text>

    <line x1="739" y1="722" x2="789" y2="722" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="792" y="681" width="338" height="82" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="961" y="705" font-size="12.5" fill="#1F2937" text-anchor="middle">closed-form gain head (ridge, pure numpy)</text>
    <text x="961" y="724" font-size="12.5" fill="#1F2937" text-anchor="middle">log g = a_f + b·X</text>
    <text x="961" y="743" font-size="11.5" fill="#1F2937" text-anchor="middle">slope b: fitted on 170 cheap ladder rows</text>
    <text x="961" y="758" font-size="11.5" fill="#1F2937" text-anchor="middle">intercept a_f: anchored by the 5 HF rows</text>

    <text x="30" y="800" font-size="11.5" font-style="italic" fill="#6B7280">MF method: the true few-shot composition (no test-time LF exists here — registration issue does not apply). Cheap levels teach how the correction scales with parameters;</text>
    <text x="30" y="818" font-size="11.5" font-style="italic" fill="#6B7280">the 5 HF samples anchor the level. Surprise: dropping duplicated cross-level pairs (self_only) beats the head — weighting vs step-count disambiguation running now (B4).</text>
  </g>
  <line x1="30" y1="838" x2="1130" y2="838" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= P4 ROUTER ================= -->
  <g>
    <text x="30" y="868" font-size="15" font-weight="bold" fill="#1F2937">Synthesis (in design): s4-B3 ROUTER — route by data property, gate everything out-of-fold</text>

    <rect x="30" y="895" width="185" height="58" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
    <text x="122" y="919" font-size="12.5" fill="#1F2937" text-anchor="middle">dataset arrives:</text>
    <text x="122" y="936" font-size="12.5" fill="#1F2937" text-anchor="middle">test-time LF available?</text>

    <line x1="215" y1="910" x2="288" y2="910" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="251" y="901" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">yes</text>
    <line x1="215" y1="940" x2="288" y2="985" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <text x="240" y="975" font-size="11" font-weight="bold" fill="#EA580C" text-anchor="middle">no</text>

    <rect x="291" y="880" width="470" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="526" y="904" font-size="12.5" fill="#1F2937" text-anchor="middle">defect-correction branch: corrector trained on the LSI-cleaned residual</text>
    <text x="526" y="921" font-size="12.5" fill="#1F2937" text-anchor="middle">eligibility pre-registered: 1 − ρ_LSI ≥ 0.15 (else fall back to LSI / copy-LF)</text>

    <rect x="291" y="960" width="470" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="526" y="982" font-size="12.5" fill="#1F2937" text-anchor="middle">transfer branch: champion FNO + FiLM (ifc_poisson only)</text>
    <text x="526" y="999" font-size="12.5" fill="#1F2937" text-anchor="middle">+ s1's ladder/gain machinery where a ladder exists</text>

    <line x1="761" y1="910" x2="826" y2="935" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="761" y1="985" x2="826" y2="960" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="829" y="925" width="170" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="914" y="947" font-size="12.5" fill="#1F2937" text-anchor="middle">every keep/route call</text>
    <text x="914" y="964" font-size="12.5" fill="#1F2937" text-anchor="middle">OOF-gated (cross-fitting)</text>

    <line x1="999" y1="950" x2="1044" y2="950" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="1047" y="925" width="83" height="50" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
    <text x="1088" y="954" font-size="12.5" fill="#1F2937" text-anchor="middle">prediction</text>

    <text x="30" y="1040" font-size="11.5" font-style="italic" fill="#6B7280">Primary pre-registered claim is no-harm: no dataset worse than the better of its two branches. Motivated by s4-B2's finding that in-sample keep-tests invert their decisions 5/5.</text>
  </g>
  <line x1="30" y1="1062" x2="1130" y2="1062" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ================= Score strip ================= -->
  <g>
    <text x="30" y="1094" font-size="15" font-weight="bold" fill="#1F2937">Where they stand (skill, lower is better · log scale)</text>
    <text x="30" y="1113" font-size="11.5" fill="#6B7280">panel-geomean bars are inflated by the benchmark's registration defect (denominators 2–8.6× too large on sharp datasets) — see mentor note; ifc_poisson bars are unaffected</text>

    <!-- axis: log scale from 0.1 to 10; x = 220 + 265*log10(v/0.1)  span 0.1->10 over 795px -->
    <line x1="220" y1="1330" x2="1015" y2="1330" stroke="#9CA3AF" stroke-width="1.4"/>
    <g font-size="10.5" fill="#6B7280" text-anchor="middle">
      <text x="220" y="1348">0.1</text><text x="485" y="1348">1.0 = copy-LF parity</text><text x="750" y="1348">10</text>
    </g>
    <line x1="485" y1="1140" x2="485" y2="1330" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="5,4"/>

    <!-- bars: from x=220 (0.1) to value; height 20, gap 8 -->
    <!-- trust_head 0.188 -> x=220+265*log10(1.88)=292.6 -->
    <g font-size="11.5" fill="#1F2937">
      <rect x="220" y="1145" width="73" height="20" rx="4" fill="#7C3AED"/><text x="300" y="1160">s6-B2 trust head — 0.188 (panel)</text>
      <rect x="220" y="1173" width="76" height="20" rx="4" fill="#7C3AED" opacity="0.75"/><text x="303" y="1188">s6-B2 circ_repair — 0.193 (panel)</text>
      <rect x="220" y="1201" width="98" height="20" rx="4" fill="#7C3AED" opacity="0.55"/><text x="325" y="1216">s6-B1 Richardson DC — 0.235 (panel)</text>
      <rect x="220" y="1229" width="154" height="20" rx="4" fill="#2563EB"/><text x="381" y="1244">s2-B2 lf_resid_fno — 0.380 (beyond-copy set)</text>
      <rect x="220" y="1257" width="208" height="20" rx="4" fill="#EA580C"/><text x="435" y="1272">s1-B3 self_only — 0.609 (ifc_poisson)</text>
      <rect x="220" y="1285" width="223" height="20" rx="4" fill="#EA580C" opacity="0.75"/><text x="450" y="1300">s1-B3 gain head — 0.694 (ifc_poisson)</text>
      <rect x="220" y="1313" width="0" height="0" fill="none"/>
    </g>
    <!-- champion 6.70 -> x=220+265*log10(67)=704.7 -->
    <rect x="220" y="1360" width="0" height="0" fill="none"/>
    <g font-size="11.5" fill="#1F2937">
      <rect x="220" y="1368" width="485" height="20" rx="4" fill="#9CA3AF"/><text x="712" y="1383">baseline mf_fno_transfer_film — 6.70 (panel)</text>
    </g>
    <text x="30" y="1160" font-size="11.5" fill="#6B7280">defect correction</text>
    <text x="30" y="1244" font-size="11.5" fill="#6B7280">residual FNO</text>
    <text x="30" y="1272" font-size="11.5" fill="#6B7280">few-shot ladder</text>
    <text x="30" y="1383" font-size="11.5" fill="#6B7280">transfer only</text>

    <text x="30" y="1430" font-size="11.5" font-style="italic" fill="#6B7280">Bar color groups the MF method family (purple = defect correction, blue = residual operator, orange = ladder composition, gray = transfer baseline).</text>
    <text x="30" y="1448" font-size="11.5" font-style="italic" fill="#6B7280">All numbers seed-0, smoke tier (200 epochs); 3-seed confirmation of the top 3 happens at round end.</text>
  </g>
</svg>
