    imported, never edited).
  _declared_reuse: 'role (a), round-2 program 5.10a: the DC-lineage corrector remains a declared FROZEN test-time sub-component
    behind a condition->pseudo-LF front end. A5 (ridge=0) is the literal B1 replay and is declared as the pre-registered replication/attribution
    arm, not as a novelty claim.'
  _novelty_declaration: 'The new pathway is a SINGLE shared FiLM-FNO trunk behind a ROUTE SWITCH (condition->pseudo-LF->frozen
    regularised corrector->HF vs condition->HF) with a budget accountant that holds total optimizer epochs equal across routes
    (E_emu + 2*E_dc = 300) and a REGULARISED LSI transfer stage (LOOCV ridge + band-limit above the LF Nyquist). The direct_*
    arms are declared MATCHED CONTROLS inside that contrast, not candidate architectures: they carry the zero-parameter analytic
    IC-synthesis channel (r2s1_direct''s heads are FiLM-only on the raw condition vector) and are budget-locked to the stack.
    A4 direct_film is the pre-registered r2s1 calibration arm (expected near r2s1_direct-B2''s certified 23.7753); if it lands
    far from that, the family and not the route is the story. Reviewer question ''is this a rebadge of r2s1_direct?'' is answered
    here, before the build.'
  _script_env:
    ROUND2_EVAL_RESULTS: $OUT_DIR/training
    ROUND2_EVAL_CACHE: $OUT_DIR/cache
    _why: 'MANDATORY, carried from B1''s review-FAIL discharge d5069a74: without these, score_panel.py::_results_dir()/_cache_dir()
      default to EVAL_DIR/{results,cache} and the job writes per-cell JSONs and multi-GB checkpoint trees into the FROZEN
      round-2 eval layer (immutable 3). Export both after OUT_DIR= and before BOTH score_panel.py invocations, and mkdir -p
      $OUT_DIR/cache.'
  _note: 'Keys prefixed _ are card directives, NOT passed to --env. score_panel.py --datasets accepts ONLY ''panel'' | ''guard''
    | a comma-list of dataset NAMES; the literal ''panel'' resolves to the ROUND-2 six-dataset panel via round2/project.yaml
    and MUST NOT be used (ADR r3-0004). The guard run is a SEPARATE invocation with --datasets guard (smoke tier 200, seed
    0). Checkpoint dirs must be FRESH under mffp_autoresearch_outputs/round3/r3s2_field_reach/B2/ckpt (never reused from B1)
    and R3S2B2_CKPT_DATA_HASH_BIND=1 binds the dataset content hash into last.pt so a resume against changed arrays aborts
    instead of zero-stepping (r3s3-B1 / STOP-THE-LINE #2). Post-run acceptance: tools/lsi_transfer_stability_audit.py on the
    B2 tree (G2 leg iii), tools/zero_work_resume_scan.py and tools/stale_checkpoint_audit.py --exclude stale_ckpt (r3s4-B1
    part 7b: do NOT read train_seconds_collapsed as evidence of staleness). Wall-clock: B1 ran 10 arms x 5 datasets x 200
    epochs (2400 optimizer epochs/dataset) in 44.33/36.55/36.55 min per seed on one H200 (state/timing_ledger.json); B2 spends
    1400 optimizer epochs/dataset but 600 of them are on the HF grid (the two direct heads), so estimate 45-70 min/seed and
    request --time 03:00:00 (>=1h => --mail-user=ezeng@caltech.edu --mail-type=END,FAIL per project.yaml sbatch).'
