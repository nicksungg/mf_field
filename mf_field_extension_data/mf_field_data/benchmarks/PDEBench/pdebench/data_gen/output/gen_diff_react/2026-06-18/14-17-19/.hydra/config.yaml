dataverse:
  lib_name: pyDaRUS
  dataset_id: doi:10.18419/darus-2922
  metadatablocks:
    citation:
      author:
      - name: Timothy Praditia
        affiliation: Universität Stuttgart
        identifier_scheme: ORCID
        identifier: 0000-0003-3619-9122
      description:
      - text: 2D diffusion-reaction dataset generated for the PDE benchmark paper
        date: '2022'
      contact:
      - name: Timothy Praditia
        affiliation: Universität Stuttgart
        email: timothy.praditia@iws.uni-stuttgart.de
      title: 2D diffusion-reaction dataset
      subject:
      - computer_and__information__science
      - physics
    process:
      processing_methods:
      - name: FVM
        description: Finite Volume Method is a spatial discretization method to calculate
          spatial derivative in a Partial Differential Equation. It integrates the
          fluxes at all discrete cell boundaries so that it ensures conservation.
        parameters: cell length, cell width
      - name: RK45
        description: Explicit Runge-Kutta method of order 5(4) is a time integration
          method to solve the temporal derivative in a Partial Differential Equation.
          It is an adaptive time integration scheme to ensure better accuracy and
          computation efficiency.
        parameters: time step size, total time, error tolerance
      method_parameters:
      - name: cell length
        symbol: dx
        unit: m
        value: 0.015625
      - name: cell width
        symbol: dy
        unit: m
        value: 0.015625
      - name: time step size
        symbol: dt
        unit: s
        value: 0.05
      - name: total time
        symbol: t
        unit: s
        value: 5
      - name: error tolerance
        symbol: \epsilon
        unit: '-'
        value: 1.0e-06
    engMeta: {}
    codeMeta: {}
