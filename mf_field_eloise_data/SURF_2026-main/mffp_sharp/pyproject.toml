[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mffp_sharp"
version = "0.0.1"
description = "Sharp-field PDE dataset generation for the MFFP benchmark"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "h5py", "pyyaml", "scikit-image", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
